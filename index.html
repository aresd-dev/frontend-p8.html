<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Gerenciamento de Clientes</h2>
        
        <form id="clienteForm">
            <div class="input-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite o nome do cliente" required>
            </div>
            
            <div class="input-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite o e-mail do cliente" required>
            </div>
            
            <button type="submit">Cadastrar Cliente</button>
        </form>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #bdc3c7;">

        <h3>Clientes Cadastrados</h3>
        <ul id="listaClientes"></ul>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
